<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>

  <!-- Your normal site CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- UMBRA-only styles -->
  <style>
    .cinema {
      background: #050505;
      color: #eaeaea;
      font-family: "Georgia", serif;
      line-height: 1.8;
    }

    .title-block {
      text-align: center;
      padding: 80px 20px;
    }

    .title-block h1 {
      letter-spacing: 10px;
      font-size: 42px;
    }

    .subtitle {
      color: #888;
    }

    .scene {
      padding: 80px 20px;
      max-width: 800px;
      margin: auto;
    }

    .scene-label {
      text-align: center;
      font-size: 12px;
      letter-spacing: 4px;
      color: #777;
      margin-bottom: 40px;
    }

    .stage {
      font-style: italic;
      color: #aaa;
      text-align: center;
      margin: 30px 0;
    }

    .character {
      text-align: center;
      letter-spacing: 2px;
      margin-top: 40px;
      font-weight: bold;
    }

    .line {
      text-align: center;
      margin: 10px auto;
      max-width: 650px;
    }

    .monologue {
      text-align: center;
      max-width: 700px;
      margin: 30px auto;
      font-size: 18px;
    }

    .emphasis {
      font-size: 22px;
      font-weight: bold;
    }

    .question {
      text-align: center;
      font-style: italic;
      color: #ccc;
      margin: 30px 0;
    }

    .choice {
      text-align: center;
      font-size: 20px;
      margin: 40px 0;
    }

    .impact {
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 50px 0;
    }

    .shadow {
      text-align: center;
      font-style: italic;
      color: #bbb;
    }

    .final {
      text-align: center;
      font-size: 36px;
      letter-spacing: 12px;
      margin-top: 60px;
    }
  </style>
</head>

<body>
  {{ content }}
</body>
</html>
